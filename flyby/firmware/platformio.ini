; Flyby firmware. Build and upload with PlatformIO:
;   pio run -t upload          (default: ESP32 Trinity or ESP32 DevKit wired as in the README)
;   pio run -e fm6126a -t upload   (same, for panels with the FM6126A driver chip)
;   pio device monitor

[platformio]
default_envs = esp32

[env]
platform = espressif32@6.9.0          ; Arduino core 2.0.17
framework = arduino
board = esp32dev
board_build.partitions = huge_app.csv ; WiFi + TLS + web server need more than the default 1.2 MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#3.0.14
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@^1.16.1
    bblanchon/ArduinoJson@7.4.2
    tzapu/WiFiManager@2.0.17
build_flags =
    -DCORE_DEBUG_LEVEL=2

[env:esp32]

[env:fm6126a]
build_flags =
    ${env.build_flags}
    -DPANEL_DRIVER=HUB75_I2S_CFG::FM6126A
